services:
  - type: web
    name: audio-analysis-api
    env: python
    region: oregon
    plan: free
    buildCommand: apt-get update && apt-get install -y ffmpeg && pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port 10000
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: WHISPER_MODEL
        value: whisper-1
      - key: ANALYSIS_MODEL
        value: gpt-4o-mini
